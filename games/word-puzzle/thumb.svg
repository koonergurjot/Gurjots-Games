<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-labelledby="title desc">
  <title id="title">Daily Word Puzzle thumbnail</title>
  <desc id="desc">A row of Wordle-style letter tiles: some green, one yellow, some gray, spelling out a guess.</desc>
  <defs>
    <linearGradient id="wp-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#151a2e" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
  </defs>
  <rect width="160" height="90" rx="8" fill="url(#wp-bg)" />
  <g font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle" fill="#f8fafc">
    <rect x="14" y="20" width="22" height="22" rx="4" fill="#22c55e" />
    <text x="25" y="36">W</text>
    <rect x="40" y="20" width="22" height="22" rx="4" fill="#4b5563" />
    <text x="51" y="36">O</text>
    <rect x="66" y="20" width="22" height="22" rx="4" fill="#eab308" />
    <text x="77" y="36">R</text>
    <rect x="92" y="20" width="22" height="22" rx="4" fill="#22c55e" />
    <text x="103" y="36">D</text>
    <rect x="118" y="20" width="22" height="22" rx="4" fill="#4b5563" />
    <text x="129" y="36">S</text>
  </g>
  <g font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#c7d2e0">
    <rect x="20" y="52" width="16" height="16" rx="3" fill="#2a3346" />
    <rect x="40" y="52" width="16" height="16" rx="3" fill="#2a3346" />
    <rect x="60" y="52" width="16" height="16" rx="3" fill="#22c55e" />
    <rect x="80" y="52" width="16" height="16" rx="3" fill="#2a3346" />
    <rect x="100" y="52" width="16" height="16" rx="3" fill="#2a3346" />
    <rect x="120" y="52" width="16" height="16" rx="3" fill="#eab308" />
  </g>
</svg>
