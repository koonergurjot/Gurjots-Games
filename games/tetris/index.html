<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris</title>
  <link rel="preload" href="../../assets/audio/hit.wav" as="audio" />
  <link rel="preload" href="../../assets/audio/powerup.wav" as="audio" />
  <link rel="preload" href="../../assets/audio/click.wav" as="audio" />
  <link rel="stylesheet" href="../common/game-shell.css" />
  <link rel="stylesheet" href="./tetris.css" />
  <style id="gg-viewport-shim">
    html,body{height:100%}
    body{margin:0}
    canvas,#app,.game-root{max-width:100vw;max-height:100vh}
  </style>
</head>
<body class="game-shell">
  <main class="game-shell__main">
    <div class="game-shell__surface" data-game-viewport>
      <canvas id="t" width="300" height="600" data-basew="300" data-baseh="600" role="img" aria-label="Tetris well"></canvas>
      <p class="tetris-lobby-link"><a href="lobby.html">Replays &amp; spectate &rsaquo;</a></p>
    </div>
  </main>
  <div id="score" hidden></div>

  <script src="../../js/resizeCanvas.global.js"></script>
  <script src="../../js/gameUtil.js"></script>
  <script src="../../js/sfx.js"></script>
  <script src="./engine.js"></script>
  <script src="./replay.js"></script>
  <script type="module" src="../../shared/ui/hud.js"></script>
  <script type="module" src="./tetris.js"></script>
  <script type="module" src="../common/game-shell.js" data-back-href="../../index.html" data-game="tetris"></script>

  <link rel="stylesheet" href="/games/common/diag-modal.css">
  <script src="/games/common/diagnostics/report-store.js" defer></script>
  <script src="/games/common/diag-core.js" defer></script>
  <script src="/games/common/diag-capture.js" defer></script>
</body>
</html>
