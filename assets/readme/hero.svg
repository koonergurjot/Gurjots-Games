<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Gurjot's Games</title>
  <desc id="d">Animated arcade banner: a pong ball rallies across a neon grid past a tetromino, an asteroid and a snake, above the title Gurjot's Games.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141b3d"/>
      <stop offset="55%"  stop-color="#0c1230"/>
      <stop offset="100%" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8ec8ff"/>
      <stop offset="34%"  stop-color="#c58bff"/>
      <stop offset="67%"  stop-color="#ff8bb0"/>
      <stop offset="100%" stop-color="#ffd166"/>
      <animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1"  dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec8ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8ec8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ec8ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8ec8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <ellipse cx="600" cy="330" rx="560" ry="150" fill="url(#glow)"/>

  <!-- perspective floor -->
  <g stroke="#8ec8ff" stroke-opacity="0.16" stroke-width="1.2">
    <path d="M0 262h1200M0 282h1200M0 306h1200M0 336h1200"/>
    <path d="M600 246 L-140 340M600 246 L180 340M600 246 L400 340M600 246 L540 340
             M600 246 L660 340M600 246 L800 340M600 246 L1020 340M600 246 L1340 340"/>
  </g>
  <rect y="246" width="1200" height="94" fill="url(#floor)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="90"  cy="52"  r="1.6" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="96"  r="1.2" opacity=".5"><animate attributeName="opacity" values=".5;.1;.5" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="1085" cy="64" r="1.7" opacity=".65"><animate attributeName="opacity" values=".65;.15;.65" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="38"  r="1.1" opacity=".45"><animate attributeName="opacity" values=".45;.1;.45" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="44"  r="1.3" opacity=".5"><animate attributeName="opacity" values=".5;.12;.5" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="88"  r="1.2" opacity=".4"><animate attributeName="opacity" values=".4;.08;.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="180" r="1.1" opacity=".35"><animate attributeName="opacity" values=".35;.08;.35" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="176" r="1.2" opacity=".35"><animate attributeName="opacity" values=".35;.08;.35" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- paddles + rallying ball -->
  <rect x="62" y="44" width="9" height="52" rx="4.5" fill="#8ec8ff">
    <animate attributeName="y" values="44;92;44" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <rect x="1129" y="92" width="9" height="52" rx="4.5" fill="#ff8bb0">
    <animate attributeName="y" values="92;44;92" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
  <circle r="9" fill="#fff6c9" filter="url(#soft)" opacity=".85">
    <animate attributeName="cx" values="80;1120;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="104;58;104" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle r="7" fill="#fffdf2">
    <animate attributeName="cx" values="80;1120;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="104;58;104" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <!-- drifting tetromino -->
  <g transform="translate(104 92)">
    <animateTransform attributeName="transform" type="translate" values="104 92;104 108;104 92" dur="5s" repeatCount="indefinite" additive="replace"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 21 21" to="360 21 21" dur="14s" repeatCount="indefinite"/>
      <rect x="0"  y="0"  width="20" height="20" rx="3" fill="#7ee0c0"/>
      <rect x="22" y="0"  width="20" height="20" rx="3" fill="#7ee0c0"/>
      <rect x="22" y="22" width="20" height="20" rx="3" fill="#57c4a3"/>
      <rect x="44" y="22" width="20" height="20" rx="3" fill="#57c4a3"/>
    </g>
  </g>

  <!-- asteroid -->
  <g transform="translate(1000 108)" opacity=".95">
    <animateTransform attributeName="transform" type="translate" values="1000 108;1000 92;1000 108" dur="6.5s" repeatCount="indefinite"/>
    <path d="M0 -24 L20 -14 L26 8 L10 24 L-12 22 L-25 4 L-19 -15 Z" fill="none" stroke="#ffd166" stroke-width="3.2" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- snake -->
  <g>
    <path d="M300 268 h56 v-22 h44 v22 h52" fill="none" stroke="#5de06d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
      <animate attributeName="stroke-dasharray" values="0 400;150 400;0 400" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="470" cy="246" r="8" fill="#e84141">
      <animate attributeName="r" values="8;10;8" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="168" font-size="76" font-weight="800" letter-spacing="2" fill="url(#ink)">GURJOT'S GAMES</text>
    <text x="600" y="208" font-size="21" font-weight="600" letter-spacing="5.5" fill="#9fb0d0">15 BROWSER GAMES &#183; NO INSTALL &#183; JUST PLAY</text>
  </g>
</svg>
